<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-IMMUNE 민원 처리 내역</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sour+Gummy&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            gummy: ['"Sour Gummy"', 'cursive'],
          },
          colors: {
            ink: '#363636',
            muted: '#c4c4c4',
            canvas: '#f4f4f4',
            brand: '#f0322e',
            salmon: '#f06548',
            approve: '#12b76a',  // 승인(초록)
          },
          boxShadow: { card: '0px 0px 14px 5px #3636360d' },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif; }
    .scroll-y { overflow-y: auto; scrollbar-width: thin; }
    .scroll-y::-webkit-scrollbar { width: 8px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 8px; }
  </style>
</head>

<body class="bg-canvas text-ink">

  <!-- ============ 좌측 아이콘 네비게이션 ============ -->
  <nav class="fixed top-0 left-0 z-20 flex h-screen w-[92px] flex-col items-center gap-8 pt-[210px]">
    <button id="btnHome" class="grid h-11 w-11 place-items-center rounded-xl text-ink/80 hover:bg-white" title="대시보드">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button id="btnHistory" class="grid h-11 w-11 place-items-center rounded-xl text-ink/60 hover:bg-white" title="지침 문서">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
    </button>
    <button class="grid h-11 w-11 place-items-center rounded-xl text-ink/60 hover:bg-white" title="설정">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-2-1.2l-.4-2.6H8.5l-.4 2.6a7.3 7.3 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.3 7.3 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>
    </button>
  </nav>

  <!-- ============ 상단 헤더 ============ -->
  <header class="fixed top-0 left-[147px] right-0 z-10 flex h-[100px]">
    <div class="flex h-[100px] w-[300px] items-center justify-center rounded-b-[20px] bg-white shadow-card">
      <img src="Logo/Ktmns.png" alt="kt m&s" class="h-7 object-contain"
           onerror="this.outerHTML='<span class=&quot;text-2xl font-extrabold&quot;><span style=&quot;color:#f0322e&quot;>KT</span> m&amp;s</span>'"/>
    </div>
    <div class="ml-[6px] flex h-[100px] flex-1 items-center gap-4 rounded-b-[20px] bg-white pl-10 shadow-card">
      <span class="font-gummy text-[34px] leading-none text-ink">A-IMMUNE</span>
      <span class="text-[20px] font-semibold text-ink">관리자 대시보드</span>
    </div>
  </header>

  <!-- ============ 좌측 프로필 사이드바 ============ -->
  <aside class="fixed top-0 left-[147px] z-0 flex h-screen w-[300px] flex-col pt-[130px]">
    <div class="flex items-center gap-4 px-2 pb-6">
      <div class="grid h-[68px] w-[68px] place-items-center rounded-full bg-canvas">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#c4c4c4"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg>
      </div>
      <div>
        <div class="flex items-end gap-2">
          <span class="text-[22px] font-medium text-ink" id="mgrName">김지민</span>
          <span class="text-[22px] text-ink" id="mgrRank">차장</span>
        </div>
        <div class="text-[15px] text-muted">KT m&s</div>
      </div>
    </div>

    <div class="mx-1 flex items-center gap-3 rounded-[16px] bg-canvas px-3 py-3.5">
      <div class="grid h-11 w-11 place-items-center rounded-[10px] bg-white shadow-card">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#363636"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg>
      </div>
      <span class="text-[16px] font-medium">관리자 아이디</span>
      <span class="ml-auto pr-2 text-[16px]" id="mgrId">M-001</span>
    </div>

    <!-- 뮤니 캐릭터 (이 페이지는 idle만) -->
    <div class="mt-auto flex flex-col items-center pb-[500px]">
      <img id="muni" src="img/muni-idle.gif" alt="뮤니" class="w-[150px] object-contain"
           onerror="this.style.display='none'"/>
    </div>
  </aside>

  <!-- ============ 메인 컨텐츠 ============ -->
  <main class="ml-[447px] min-h-screen px-8 pt-[130px] pb-10">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
      <h2 class="text-[30px] font-semibold">민원 처리 내역</h2>

      <!-- 필터 탭 (전체 / 승인 / 반려) -->
      <div id="filterBar" class="inline-flex items-center gap-1 rounded-[16px] bg-white p-1 shadow-card">
        <button data-filter="ALL"      class="filter-btn rounded-[12px] px-5 py-2 text-[16px] font-medium">전체</button>
        <button data-filter="APPROVE"  class="filter-btn rounded-[12px] px-5 py-2 text-[16px] font-medium">승인</button>
        <button data-filter="REJECT"   class="filter-btn rounded-[12px] px-5 py-2 text-[16px] font-medium">반려</button>
      </div>
    </div>

    <!-- 카드 그리드 -->
    <div id="cardGrid" class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">
      <div id="listLoading" class="col-span-full py-16 text-center text-muted">불러오는 중…</div>
    </div>
  </main>

  <script src="js/muni.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
