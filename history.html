<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-IMMUNE 민원 처리 내역</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sour+Gummy&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'], gummy: ['"Sour Gummy"', 'cursive'] },
          colors: {
            ink: '#363636', muted: '#c4c4c4', canvas: '#f4f4f4',
            brand: '#f0322e', salmon: '#f06548', approve: '#00bd9d',
          },
          boxShadow: { card: '0px 0px 7px 0px #3636360d', nav: '0px 0px 14px 5px #3636360d' },
        },
      },
    };
  </script>

  <style>
    html, body { margin: 0; background: #e9e9e9; }
    body { font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
           display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    #viewport { position: relative; }
    #stage { position: absolute; top: 0; left: 0; width: 2560px; height: 1600px;
             background: #f4f4f4; transform-origin: top left; overflow: hidden; }
    .scroll-y { overflow-y: auto; scrollbar-width: thin; }
    .scroll-y::-webkit-scrollbar { width: 8px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 8px; }
  </style>
</head>

<body class="text-ink">
<div id="viewport">
<div id="stage">

  <!-- ============ NavIcon · x=39 y=264 · 두 화면 공통 ============ -->
  <nav class="absolute left-[39px] top-[264px] flex w-[70px] flex-col gap-[25px]">
    <!-- 홈(진행 대기 목록): 비활성 -->
    <button id="btnHome" class="block h-[70px] w-[70px]" title="진행 대기 목록">
      <img src="Button/Primary/Medium/Default/Home.png" alt="진행 대기 목록" class="h-[70px] w-[70px] object-contain" />
    </button>
    <!-- 지침서(민원 처리 내역): 이 페이지에서 활성 -->
    <button id="btnHistory" class="block h-[70px] w-[70px]" title="민원 처리 내역">
      <img src="Button/Primary/Medium/Active/CheckedCard.png" alt="민원 처리 내역" class="h-[70px] w-[70px] object-contain" />
    </button>
    <!-- 설정 -->
    <button id="btnSettings" class="block h-[70px] w-[70px]" title="설정">
      <img src="Button/Primary/Medium/Default/Setting.png" alt="설정" class="h-[70px] w-[70px] object-contain" />
    </button>
  </nav>

  <!-- ============ NaveTitle (헤더) · x=639 ============ -->
  <header class="absolute left-[639px] top-0 flex h-[121px] w-[1921px] items-center justify-center gap-[28px] bg-white shadow-nav">
    <!-- 뮤니(헤더): 움직이는 gif. newMUNI_move.gif가 없으면 같은 이름의 jpg로 대체 -->
    <img src="img/newMUNI_move.gif" alt="뮤니" class="h-[89px] object-contain"
         onerror="this.onerror=function(){this.style.display='none'}; this.src='img/newMUNI_move.jpg'"/>
    <span class="text-[32px] font-bold leading-none text-ink">A Immune</span>
    <span class="text-[28px] font-semibold leading-none text-ink">관리자 대시보드</span>
  </header>

  <!-- ============ NavProfile · x=147 ============ -->
  <div class="absolute left-[147px] top-0 flex h-[121px] w-[492px] items-center justify-center bg-white shadow-nav">
    <img src="Logo/Ktmns.png" alt="kt m&s" class="h-[44px] object-contain"
         onerror="this.outerHTML='<span class=&quot;text-[34px] font-extrabold&quot;><span style=&quot;color:#f0322e&quot;>kt</span> m&amp;s</span>'"/>
  </div>
  <div class="absolute left-[147px] top-[121px] flex h-[145px] w-[492px] items-center gap-7 bg-canvas px-[71px] shadow-nav">
    <img src="Button/Primary/Medium/Default/Profile.png" alt="프로필" class="h-[120px] w-[120px] shrink-0 object-contain" />
    <div>
      <div class="flex items-end gap-3">
        <span class="text-[34px] font-medium text-ink" id="mgrName">김지민</span>
        <span class="text-[34px] text-ink" id="mgrRank">차장</span>
      </div>
      <div class="mt-1 text-[24px] text-muted">KT m&s</div>
    </div>
  </div>
  <div class="absolute left-[147px] top-[266px] h-[1334px] w-[492px] bg-white shadow-nav">
    <div class="absolute left-[24px] top-[36px] flex h-[96px] w-[442px] items-center gap-5 rounded-[16px] bg-canvas px-4">
      <img src="Button/Primary/Medium/Default/Profile.png" alt="관리자" class="h-[70px] w-[70px] shrink-0 object-contain" />
      <span class="text-[27px] font-medium">관리자 아이디</span>
      <span class="ml-auto pr-3 text-[27px]" id="mgrId">M-001</span>
    </div>
  </div>

  <!-- ============ 메인: 민원 처리 내역 · x=639 y=121 ============ -->
  <div class="absolute left-[639px] top-[121px] h-[1479px] w-[1921px]">
    <!-- 타이틀 (가운데) · 프레임 y=220 -->
    <h2 class="absolute left-0 top-[99px] w-full text-center text-[40px] font-semibold">민원 처리 내역</h2>

    <!-- 스크롤 영역: 승인/반려 섹션 · 프레임 y=302~ -->
    <div id="sections" class="scroll-y absolute left-[35px] top-[181px] h-[1270px] w-[1854px] pr-2">
      <div id="loading" class="py-24 text-center text-[24px] text-muted">불러오는 중…</div>
    </div>
  </div>

</div><!-- /stage -->
</div><!-- /viewport -->

  <script>
    (function () {
      const stage = document.getElementById('stage');
      const vp = document.getElementById('viewport');
      function fit() {
        const s = Math.min(window.innerWidth / 2560, window.innerHeight / 1600);
        stage.style.transform = 'scale(' + s + ')';
        vp.style.width = (2560 * s) + 'px';
        vp.style.height = (1600 * s) + 'px';
      }
      window.addEventListener('resize', fit); fit();
    })();
  </script>
  <script src="js/history.js"></script>
</body>
</html>
