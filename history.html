<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-IMMUNE 민원 처리 내역</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sour+Gummy&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'], gummy: ['"Sour Gummy"', 'cursive'] },
          colors: {
            ink: '#363636', muted: '#c4c4c4', canvas: '#f4f4f4',
            brand: '#f0322e', salmon: '#f06548', approve: '#12b76a',
          },
          boxShadow: { card: '0px 0px 14px 5px #3636360d' },
        },
      },
    };
  </script>

  <style>
    html, body { margin: 0; background: #e9e9e9; }
    body { font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
           display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    #viewport { position: relative; }
    #stage { position: absolute; top: 0; left: 0; width: 2560px; height: 1600px;
             background: #f4f4f4; transform-origin: top left; overflow: hidden; }
    .scroll-y { overflow-y: auto; scrollbar-width: thin; }
    .scroll-y::-webkit-scrollbar { width: 8px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 8px; }
  </style>
</head>

<body class="text-ink">
<div id="viewport">
<div id="stage">

  <!-- ============ NavIcon · x=39 y=264 ============ -->
  <nav class="absolute left-[39px] top-[264px] flex w-[70px] flex-col gap-[25px]">
    <button id="btnHome" class="grid h-[70px] w-[70px] place-items-center rounded-2xl text-ink/50 hover:bg-white" title="진행 대기 목록">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button id="btnHistory" class="grid h-[70px] w-[70px] place-items-center rounded-2xl bg-white text-ink/80" title="민원 처리 내역">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
    </button>
    <button class="grid h-[70px] w-[70px] place-items-center rounded-2xl text-ink/50 hover:bg-white" title="설정">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-2-1.2l-.4-2.6H8.5l-.4 2.6a7.3 7.3 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.3 7.3 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>
    </button>
  </nav>

  <!-- ============ NaveTitle (헤더) · x=639 ============ -->
  <header class="absolute left-[639px] top-0 flex h-[121px] w-[1921px] items-center rounded-b-[20px] bg-white shadow-card">
    <img id="muni" src="img/muni-idle.gif" alt="뮤니" class="absolute left-[41px] top-[18px] h-[89px] object-contain" onerror="this.style.display='none'"/>
    <span class="absolute left-[141px] top-[40px] text-[32px] font-bold leading-none text-ink">A Immune</span>
    <span class="absolute left-[334px] top-[44px] text-[28px] font-semibold leading-none text-ink">관리자 대시보드</span>
  </header>

  <!-- ============ NavProfile · x=147 ============ -->
  <div class="absolute left-[147px] top-0 flex h-[121px] w-[492px] items-center justify-center rounded-b-[20px] bg-white shadow-card">
    <img src="Logo/Ktmns.png" alt="kt m&s" class="h-[44px] object-contain"
         onerror="this.outerHTML='<span class=&quot;text-[34px] font-extrabold&quot;><span style=&quot;color:#f0322e&quot;>kt</span> m&amp;s</span>'"/>
  </div>
  <div class="absolute left-[147px] top-[121px] flex h-[145px] w-[492px] items-center gap-7 rounded-b-[20px] bg-white px-[71px] shadow-card">
    <div class="grid h-[120px] w-[120px] shrink-0 place-items-center rounded-full bg-canvas">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#c4c4c4"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg>
    </div>
    <div>
      <div class="flex items-end gap-3">
        <span class="text-[34px] font-medium text-ink" id="mgrName">김지민</span>
        <span class="text-[34px] text-ink" id="mgrRank">차장</span>
      </div>
      <div class="mt-1 text-[24px] text-muted">KT m&s</div>
    </div>
  </div>
  <div class="absolute left-[147px] top-[266px] h-[1334px] w-[492px] rounded-t-[20px] bg-white shadow-card">
    <div class="absolute left-[24px] top-[36px] flex h-[96px] w-[442px] items-center gap-5 rounded-[16px] bg-canvas px-4">
      <div class="grid h-[70px] w-[70px] place-items-center rounded-[12px] bg-white shadow-card">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="#363636"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6z"/></svg>
      </div>
      <span class="text-[27px] font-medium">관리자 아이디</span>
      <span class="ml-auto pr-3 text-[27px]" id="mgrId">M-001</span>
    </div>
  </div>

  <!-- ============ 메인: 민원 처리 내역 · x=639 y=121 ============ -->
  <div class="absolute left-[639px] top-[121px] h-[1479px] w-[1921px] px-12 pt-[70px]">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-6">
      <h2 class="text-[40px] font-semibold">민원 처리 내역</h2>
      <div id="filterBar" class="inline-flex items-center gap-1 rounded-[18px] bg-white p-1.5 shadow-card">
        <button data-filter="ALL"     class="filter-btn rounded-[14px] px-7 py-2.5 text-[22px] font-medium">전체</button>
        <button data-filter="APPROVE" class="filter-btn rounded-[14px] px-7 py-2.5 text-[22px] font-medium">승인</button>
        <button data-filter="REJECT"  class="filter-btn rounded-[14px] px-7 py-2.5 text-[22px] font-medium">반려</button>
      </div>
    </div>

    <div id="cardGrid" class="scroll-y grid max-h-[1230px] grid-cols-3 gap-7 pr-2">
      <div id="listLoading" class="col-span-full py-24 text-center text-[24px] text-muted">불러오는 중…</div>
    </div>
  </div>

</div><!-- /stage -->
</div><!-- /viewport -->

  <script>
    (function () {
      const stage = document.getElementById('stage');
      const vp = document.getElementById('viewport');
      function fit() {
        const s = Math.min(window.innerWidth / 2560, window.innerHeight / 1600);
        stage.style.transform = 'scale(' + s + ')';
        vp.style.width = (2560 * s) + 'px';
        vp.style.height = (1600 * s) + 'px';
      }
      window.addEventListener('resize', fit); fit();
    })();
  </script>
  <script src="js/muni.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
