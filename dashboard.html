<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A-IMMUNE 관리자 대시보드</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sour+Gummy&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'], gummy: ['"Sour Gummy"', 'cursive'] },
          colors: {
            ink: '#363636', muted: '#c4c4c4', canvas: '#f4f4f4',
            brand: '#f0322e', salmon: '#f06548',
          },
          boxShadow: { card: '0px 0px 14px 5px #3636360d' },
        },
      },
    };
  </script>

  <style>
    html, body { margin: 0; background: #e9e9e9; }
    body { font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
           display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }

    /* ===== 2560 x 1600 고정 디자인 캔버스 (화면 크기에 맞춰 축소) ===== */
    #viewport { position: relative; }
    #stage {
      position: absolute; top: 0; left: 0;
      width: 2560px; height: 1600px; background: #f4f4f4;
      transform-origin: top left; overflow: hidden;
    }

    /* 목록 → 상세 전환 */
    #listCol { transition: max-width .35s ease; }
    .layout:not(.detail-open) #listCol { max-width: 453px; margin-left: auto; margin-right: auto; }
    .layout:not(.detail-open) #detailCol { display: none; }
    .layout.detail-open #listCol { max-width: 453px; }

    .scroll-y { overflow-y: auto; scrollbar-width: thin; }
    .scroll-y::-webkit-scrollbar { width: 8px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #e2e2e2; border-radius: 8px; }
  </style>
</head>

<body class="text-ink">
<div id="viewport">
<div id="stage">

  <!-- ============ NavIcon (좌측 아이콘 레일) · x=39 y=264 · 두 화면 공통 ============ -->
  <nav class="absolute left-[39px] top-[264px] flex w-[70px] flex-col gap-[25px]">
    <!-- 홈(진행 대기 목록): 이 페이지에서 활성 -->
    <button id="btnHome" class="block h-[70px] w-[70px]" title="진행 대기 목록">
      <img src="Button/Primary/Medium/Active/Home.png" alt="진행 대기 목록" class="h-[70px] w-[70px] object-contain" />
    </button>
    <!-- 지침서(민원 처리 내역): 비활성 -->
    <button id="btnHistory" class="block h-[70px] w-[70px]" title="민원 처리 내역">
      <img src="Button/Primary/Medium/Default/CheckedCard.png" alt="민원 처리 내역" class="h-[70px] w-[70px] object-contain" />
    </button>
    <!-- 설정 -->
    <button id="btnSettings" class="block h-[70px] w-[70px]" title="설정">
      <img src="Button/Primary/Medium/Default/Setting.png" alt="설정" class="h-[70px] w-[70px] object-contain" />
    </button>
  </nav>

  <!-- ============ NaveTitle (상단 헤더) · x=639 y=0 1921x121 ============ -->
  <header class="absolute left-[639px] top-0 flex h-[121px] w-[1921px] items-center rounded-b-[20px] bg-white shadow-card">
    <!-- 뮤니(헤더) · 평소 idle, 승인/반려/확인 시 전환 -->
    <img id="muni" src="img/muni-idle.gif" alt="뮤니" class="absolute left-[41px] top-[18px] h-[89px] object-contain" onerror="this.style.display='none'"/>
    <span class="absolute left-[141px] top-[40px] text-[32px] font-bold leading-none text-ink">A Immune</span>
    <span class="absolute left-[334px] top-[44px] text-[28px] font-semibold leading-none text-ink">관리자 대시보드</span>
  </header>

  <!-- ============ NavProfile (좌측 프로필 컬럼) · x=147 w=492 ============ -->
  <!-- 로고 박스 -->
  <div class="absolute left-[147px] top-0 flex h-[121px] w-[492px] items-center justify-center rounded-b-[20px] bg-white shadow-card">
    <img src="Logo/Ktmns.png" alt="kt m&s" class="h-[44px] object-contain"
         onerror="this.outerHTML='<span class=&quot;text-[34px] font-extrabold&quot;><span style=&quot;color:#f0322e&quot;>kt</span> m&amp;s</span>'"/>
  </div>
  <!-- 프로필 카드 -->
  <div class="absolute left-[147px] top-[121px] flex h-[145px] w-[492px] items-center gap-7 rounded-b-[20px] bg-white px-[71px] shadow-card">
    <img src="Button/Primary/Medium/Default/Profile.png" alt="프로필" class="h-[120px] w-[120px] shrink-0 object-contain" />
    <div>
      <div class="flex items-end gap-3">
        <span class="text-[34px] font-medium text-ink" id="mgrName">김지민</span>
        <span class="text-[34px] text-ink" id="mgrRank">차장</span>
      </div>
      <div class="mt-1 text-[24px] text-muted">KT m&s</div>
    </div>
  </div>
  <!-- 큰 패널 + 관리자 아이디 박스 -->
  <div class="absolute left-[147px] top-[266px] h-[1334px] w-[492px] rounded-t-[20px] bg-white shadow-card">
    <div class="absolute left-[24px] top-[36px] flex h-[96px] w-[442px] items-center gap-5 rounded-[16px] bg-canvas px-4">
      <div class="grid h-[70px] w-[70px] shrink-0 place-items-center rounded-[12px] bg-white shadow-card">
        <img src="Button/Primary/Medium/Default/Profile.png" alt="관리자" class="h-[48px] w-[48px] object-contain" />
      </div>
      <span class="text-[27px] font-medium">관리자 아이디</span>
      <span class="ml-auto pr-3 text-[27px]" id="mgrId">M-001</span>
    </div>
  </div>

  <!-- ============ 메인 컨텐츠 (헤더 아래, 우측 영역) · x=639 y=121 1921x1479 ============ -->
  <div class="absolute left-[639px] top-[121px] h-[1479px] w-[1921px]">
    <div class="layout flex h-full gap-10 px-10 pt-[80px] pb-10" id="layout">

      <!-- 진행 대기 목록 -->
      <section id="listCol" class="w-full shrink-0">
        <h2 class="mb-7 text-center text-[38px] font-semibold">진행 대기 목록</h2>
        <div id="listWrap" class="scroll-y flex max-h-[1230px] flex-col gap-[18px] pr-2">
          <div id="listLoading" class="py-20 text-center text-[22px] text-muted">불러오는 중…</div>
        </div>
      </section>

      <!-- 지침서 개정 승인 (상세) -->
      <section id="detailCol" class="flex-1">
        <h2 class="mb-7 text-center text-[38px] font-semibold">지침서 개정 승인</h2>
        <div id="detailWrap" class="scroll-y relative max-h-[1250px] rounded-[20px] bg-white p-10 shadow-card"></div>
      </section>
    </div>
  </div>

</div><!-- /stage -->
</div><!-- /viewport -->

  <script>
    // 2560x1600 캔버스를 화면 크기에 맞춰 스케일
    (function () {
      const stage = document.getElementById('stage');
      const vp = document.getElementById('viewport');
      function fit() {
        const s = Math.min(window.innerWidth / 2560, window.innerHeight / 1600);
        stage.style.transform = 'scale(' + s + ')';
        vp.style.width = (2560 * s) + 'px';
        vp.style.height = (1600 * s) + 'px';
      }
      window.addEventListener('resize', fit); fit();
    })();
  </script>
  <script src="js/muni.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
